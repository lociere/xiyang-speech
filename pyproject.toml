[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiyang-speech"
version = "0.1.0"
description = "昔阳方言语音工具：应用与模型推理分别运行"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13", "build==1.2.2.post1"]

[tool.setuptools.packages.find]
include = ["backend*", "inference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
